    /* ==========================================
       1. 基本スタイル & CSS変数
       ========================================== */
    :root {
      --gap: 16px;              /* 写真間の余白 */
    }

    * {
      box-sizing: border-box;
      /* margin: 0;
      padding: 0; */
    }

    /* ==========================================
       2. レスポンシブ・ギャラリー（CSS Grid / Column）
       ========================================== */
    .gallery-container {
      max-width: 1600px;
      margin: 0 auto;
      padding: var(--gap);
      /* Masonry風の段組み表示 */
      column-count: 1;
      column-gap: var(--gap);
    }

    /* 画面サイズに応じたカラム数の調整 */
    @media (min-width: 600px)  { .gallery-container { column-count: 2; } }
    @media (min-width: 900px)  { .gallery-container { column-count: 3; } }
    @media (min-width: 1200px) { .gallery-container { column-count: 4; } }

    /* 写真カード */
    .photo-card {
      break-inside: avoid;
      margin-bottom: var(--gap);
      position: relative;
      border-radius: 8px;
      overflow: hidden;
      background-color: yellow; /*未使用ぽい*/
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      color: white;
    }

    .photo-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 24px rgba(0, 0, 0, 0.5);
    }

    .photo-card img {
      width: 100%;
      height: auto;
      display: block;
      /* 遅延読み込み時のちらつき防止 */
      transition: opacity 0.3s;
    }

    /* ホバー時のオーバーレイ（フォトグラファー情報など） */
    .photo-info {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 16px;
      background: linear-gradient(transparent, rgba(0, 0, 0, 0.8));
      opacity: 0;
      transition: opacity 0.2s ease;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
    }

    .photo-card:hover .photo-info {
      opacity: 1;
    }

    .photo-author {
      font-size: 0.875rem;
      font-weight: 600;
    }

    /* ローディングインジケータ */
    .loading {
      text-align: center;
      padding-top: 10px;
      color: gray;
      font-size: small;
    }

    /* ==========================================
       3. モーダル表示 (Lightbox)
       ========================================== */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 100;
      background-color: rgba(0, 0, 0, 0.9);
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .modal.active {
      display: flex;
    }

    .modal-content {
      max-width: 90vw;
      max-height: 90vh;
      object-fit: contain;
      border-radius: 4px;
    }

    .modal-close {
      position: absolute;
      top: 20px;
      right: 20px;
      color: #fff;
      font-size: 2rem;
      cursor: pointer;
      line-height: 1;
    }

        { key: '1988 D.C.', value: 'img/ph88dc1.jpg' },
        { key: '1988 Ontario', value: 'img/ph88ontario1.jpg' },
        { key: '1988 Arizona', value: 'img/ph88arizona1.jpg' },
        { key: '1987 Indiana', value: 'img/ph87indiana1.jpg' },
        { key: '1986 上海 1', value: 'img/ph86shanghai1.jpg' },
        { key: '1986 上海 2', value: 'img/ph86shanghai2.jpg' },
        { key: '1986 陝西', value: 'img/ph86xian1.jpg' },
    ];

    // ==========================================
    // 4. JavaScript (データ生成・無限スクロール・モーダル)
    // ==========================================

    // const TOTAL_PHOTOS = 100;    /* 目標枚数 */
    const TOTAL_PHOTOS = targets.length;    /* by nm */
    const PER_PAGE = 20;         /* 1回あたりの読み込み枚数 */
    let loadedCount = 0;

    const gallery = document.getElementById('gallery');
    const loading = document.getElementById('loading');
    const modal = document.getElementById('modal');
    const modalImg = document.getElementById('modalImg');
    const modalClose = document.getElementById('modalClose');

    // 元: 写真データを生成（Picsum Photosからダミー画像とランダムなアスペクト比を取得）
    function createPhotoData_0(index) {
      // 縦横比にバリエーションを持たせてUnsplash/500px風の敷き詰め感を作る
      const widths = [600, 600, 600, 600];
      const heights = [400, 600, 750, 900];
      const w = widths[index % widths.length];
      const h = heights[(index * 3) % heights.length];

      return {
        id: index + 1,
        // loading="lazy"用に最適な画像サイズを指定
        src: `https://picsum.photos/id/${(index % 50) + 10}/${w}/${h}`,
        author: `Photographer ${(index % 12) + 1}`
      };
    }
    // 写真データを生成 -- by nm
    function createPhotoData(index) {
      return {
        id: index + 1,
        src: targets[index].value,
        author: targets[index].key
      };
    }

    // カード要素を作成
    function renderPhotoCard(data) {
      const card = document.createElement('div');
      card.className = 'photo-card';

      card.innerHTML = `
        <img src="${data.src}" alt="Photo by ${data.author}" loading="lazy">
        <div class="photo-info">
          <span class="photo-author">${data.author}</span>
        </div>
      `;

      // クリックでモーダル表示
      card.addEventListener('click', () => {
        modalImg.src = data.src;
        modal.classList.add('active');
      });

      return card;
    }

    // 写真の追加読み込み
    function loadMorePhotos() {
      if (loadedCount >= TOTAL_PHOTOS) {
        loading.textContent = 'すべての写真を読み込みました';
        return;
      }

      const nextCount = Math.min(loadedCount + PER_PAGE, TOTAL_PHOTOS);
      const fragment = document.createDocumentFragment();

      for (let i = loadedCount; i < nextCount; i++) {
        const data = createPhotoData(i);
        const card = renderPhotoCard(data);
        fragment.appendChild(card);
      }

      gallery.appendChild(fragment);
      loadedCount = nextCount;

      if (loadedCount >= TOTAL_PHOTOS) {
        loading.textContent = 'すべての写真を読み込みました';
      }
    }

    // 無限スクロールの検知（Intersection Observer API）
    const observer = new IntersectionObserver((entries) => {
      if (entries[0].isIntersecting && loadedCount < TOTAL_PHOTOS) {
        loadMorePhotos();
      }
    }, {
      rootMargin: '200px' // スクロール底面に到達する手前で読み込みを開始
    });

    observer.observe(loading);

    // モーダルを閉じるイベント
    modalClose.addEventListener('click', () => modal.classList.remove('active'));
    modal.addEventListener('click', (e) => {
      if (e.target === modal) modal.classList.remove('active');
    });
  </script>
